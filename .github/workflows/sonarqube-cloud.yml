name: Serenity - SonarQube Cloud

on:
  push:
    branches:
      - 'feature/jardin-interactivo-animado'

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build Angular and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        
