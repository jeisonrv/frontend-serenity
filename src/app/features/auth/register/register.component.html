<div class="pantalla-auth">
  <form class="card formulario" [formGroup]="form" (ngSubmit)="enviar()">
    <h1>Crea tu cuenta</h1>
    <p class="subtitulo">Gratuito, confidencial y sin diagnóstico clínico.</p>

    <div class="field">
      <label for="nombreUsuario">Nombre de usuario</label>
      <input id="nombreUsuario" type="text" formControlName="nombreUsuario" autocomplete="username" />
      <span class="error" *ngIf="form.get('nombreUsuario')?.touched && form.get('nombreUsuario')?.invalid">
        Mínimo 3 caracteres.
      </span>
    </div>

    <div class="field">
      <label for="correo">Correo</label>
      <input id="correo" type="email" formControlName="correo" autocomplete="email" />
      <span class="error" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
        Ingresa un correo válido.
      </span>
    </div>

    <div class="field">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" formControlName="contrasena" autocomplete="new-password" />
      <span class="error" *ngIf="form.get('contrasena')?.touched && form.get('contrasena')?.invalid">
        Mínimo 8 caracteres.
      </span>
    </div>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <button class="btn btn-primary" type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>

    <p class="alterno">¿Ya tienes cuenta? <a routerLink="/login">Ingresa</a></p>
  </form>
</div>
